[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-kernel-workbench"
version = "0.1.0"
description = "Connect Linux kernel observations to service ownership and measured telemetry delivery."
requires-python = ">=3.11"
dependencies = [
  "fleet-infrastructure-catalog @ git+https://github.com/sivalinb/fleet-infrastructure-catalog.git@a8ebf82eba5d2df0a327fabc9d3439993785102d",
  "fleet-telemetry-lab @ git+https://github.com/sivalinb/fleet-telemetry-lab.git@0934e4c37e51d7305db41afa90a4069b24aecefc",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.16,<1", "build>=1,<2"]

[project.scripts]
fleet-kernel = "fleet_kernel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fleet_kernel = ["assets/*.svg", "assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["native: requires an installed OpenTelemetry Collector", "ebpf: requires Linux, BCC and tracing privileges"]

[tool.ruff]
line-length = 100

