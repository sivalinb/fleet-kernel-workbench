<path d="M32 522H1128" stroke="#cbded5"/>
<text x="32" y="550" font-size="14">A healthy queue cannot repair a missing kernel observation. A catalog dependency is exposure, not proof of an outage.</text>
<text x="32" y="574" font-size="12" fill="#59766e">Linux capture is read-only and limited to a child created by this tool. All inventory is fictional learning metadata.</text>
