<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="590" viewBox="0 0 1160 590" role="img" aria-labelledby="title desc">
<title id="title">Fleet Kernel Workbench architecture</title>
<desc id="desc">Owned Linux workload to BCC probe to Python analysis. The catalog package supplies ownership. The telemetry package supplies contracts, Collector configuration, fault relay, metrics and persistence. The real Collector sends logs to a verifying sink. Synthetic replay enters at the same Python event boundary.</desc>
